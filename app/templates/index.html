{% extends "base.html" %}
{% block title %}Игры{% endblock %}
{% block head %}
<style>
  .filters { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters input[type=search] { width: 100%; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .found { margin: 6px 0 10px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .game { display: flex; gap: 12px; padding: 10px; color: inherit; height: 142px; transition: border-color .15s; }
  .game:hover { text-decoration: none; border-color: var(--accent); }
  .game .cover { width: 90px; height: 120px; }
  .game-body { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; flex: 1; }
  .game h3 { margin: 0; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .game .meta { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game .plats { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 18px; }
  #results.loading { opacity: .5; transition: opacity .1s; }
  @media (max-width: 560px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters input[type=search] { grid-column: 1 / -1; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
{% endblock %}
{% block content %}
{% if not configured %}
  <div class="card">База данных не подключена: задайте <code>DATABASE_URL</code>.</div>
{% else %}
<form id="filters" class="filters" method="get" action="/" role="search">
  <input type="search" name="q" value="{{ q }}" placeholder="Поиск по названию" autocomplete="off" enterkeyhint="search">
  <select name="platform" aria-label="Платформа">
    <option value="">Все платформы</option>
    {% for slug, name, count in platforms %}
      <option value="{{ slug }}" {{ 'selected' if slug == platform }}>{{ name }} ({{ count }})</option>
    {% endfor %}
  </select>
  <select name="sort" aria-label="Сортировка">
    {% for key, label in sorts.items() %}
      <option value="{{ key }}" {{ 'selected' if key == sort }}>{{ label }}</option>
    {% endfor %}
  </select>
  <label class="toggle"><input type="checkbox" name="scored" {{ 'checked' if scored_only }}> Только с оценками</label>
</form>
<div id="results">{% include "_results.html" %}</div>
{% endif %}
{% endblock %}
{% block scripts %}
<script>
(() => {
  const form = document.getElementById('filters');
  const results = document.getElementById('results');
  if (!form) return;
  let timer, controller;

  function query() {
    const p = new URLSearchParams();
    for (const [k, v] of new FormData(form)) if (v && k !== 'scored') p.set(k, v);
    if (!form.scored.checked) p.set('all', '1');
    return p;
  }

  async function refresh() {
    controller?.abort();
    controller = new AbortController();
    const p = query();
    const pageUrl = p.toString() ? '/?' + p : '/';
    p.set('partial', '1');
    results.classList.add('loading');
    try {
      const response = await fetch('/?' + p, { signal: controller.signal });
      results.innerHTML = await response.text();
      history.replaceState(null, '', pageUrl);
    } catch (e) {
      if (e.name !== 'AbortError') throw e;
    } finally {
      results.classList.remove('loading');
    }
  }

  form.q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(refresh, 250); });
  form.addEventListener('change', (e) => { if (e.target.name !== 'q') refresh(); });
  form.addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(timer); refresh(); });
})();
</script>
{% endblock %}
