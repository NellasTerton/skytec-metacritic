<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Игры{% endblock %} · Metacritic Games</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a; --bg: #f4f4f2; --muted: #6b6b6b; --card: #fff; --line: #e2e2de; --accent: #2f5bd3;
      --accent-soft: #e6ecfb; --good: #1f8f3a; --mixed: #c99400; --bad: #d23c2c; --none: #9a9a9a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececec; --bg: #121212; --muted: #9a9a9a; --card: #1c1c1c; --line: #2d2d2d;
        --accent: #7fa2ff; --accent-soft: #1f2a45; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg);
      background: var(--bg); -webkit-text-size-adjust: 100%; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 10; }
    header .wrap { display: flex; gap: 20px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
    header .brand { font-weight: 700; color: var(--fg); white-space: nowrap; }
    header nav { display: flex; gap: 14px; }
    header nav a { color: var(--muted); }
    header nav a.active { color: var(--fg); font-weight: 600; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }
    main { padding-top: 16px; padding-bottom: 48px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

    .scores { display: flex; gap: 12px; align-items: center; }
    .score-item { display: inline-flex; align-items: center; gap: 6px; }
    .score-label { font-size: 12px; color: var(--muted); }
    .score { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 28px;
      padding: 0 6px; border-radius: 6px; font-weight: 700; color: #fff; background: var(--none); font-size: 14px;
      font-variant-numeric: tabular-nums; }
    .score.good { background: var(--good); } .score.mixed { background: var(--mixed); } .score.bad { background: var(--bad); }
    .score.user { border-radius: 50%; min-width: 30px; width: 30px; height: 30px; font-size: 12px; padding: 0; }

    .tag { display: inline-block; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px;
      font-size: 12px; line-height: 20px; color: var(--muted); white-space: nowrap; }
    .tag.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 8px; background: var(--line); flex: none; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cover .cover-bg { object-fit: cover; filter: blur(14px) saturate(1.2); transform: scale(1.2); opacity: .55; }
    .cover .cover-img { object-fit: contain; }
    .cover-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 22px; letter-spacing: 1px; color: var(--muted);
      background: linear-gradient(135deg, var(--line), var(--bg)); }

    button, .btn { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); cursor: pointer; display: inline-block; }
    .btn:hover { text-decoration: none; border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    input, select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); min-width: 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    .table-scroll { overflow-x: auto; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">Metacritic Games</a>
      <nav>
        <a href="/" class="{{ 'active' if nav == 'games' }}">Игры</a>
        <a href="/monitor" class="{{ 'active' if nav == 'monitor' }}">Мониторинг</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
