<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}Игры{% endblock %} · Metacritic Games</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #e8edf6; --bg: #0b1220; --bg-2: #0f1829; --muted: #8c99b0; --card: #111b2e; --card-2: #16223a;
      --line: #22304a; --accent: #2f7cf6; --accent-2: #5aa0ff; --accent-soft: rgba(47, 124, 246, .16);
      --good: #22a05a; --mixed: #e0a526; --bad: #e0483b; --none: #3a4660; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --fg: #142033; --bg: #f2f5fa; --bg-2: #e8eef7; --muted: #5f6b80; --card: #fff;
        --card-2: #f6f8fc; --line: #dbe2ee; --accent-soft: rgba(47, 124, 246, .12); --none: #a9b3c4;
        --shadow: 0 6px 20px rgba(20, 32, 51, .08); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg);
      background: var(--bg); -webkit-text-size-adjust: 100%; }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }

    header { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
    header .wrap { display: flex; gap: 22px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
    header .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px;
      color: var(--fg); white-space: nowrap; }
    header .brand:hover { text-decoration: none; }
    header .brand .logo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #6a5cff); color: #fff; }
    header .brand .logo .icon { width: 20px; height: 20px; }
    header nav { display: flex; gap: 6px; }
    header nav a { color: var(--muted); padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
    header nav a:hover { color: var(--fg); text-decoration: none; background: var(--card); }
    header nav a.active { color: #fff; background: var(--accent); }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    main { padding-top: 18px; padding-bottom: 48px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

    .scores { display: flex; gap: 14px; align-items: center; }
    .score-item { display: inline-flex; align-items: center; gap: 7px; }
    .score-label { font-size: 12px; color: var(--muted); }
    .score { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 30px;
      padding: 0 7px; border-radius: 7px; font-weight: 800; color: #fff; background: var(--none); font-size: 14px;
      font-variant-numeric: tabular-nums; }
    .score.good { background: var(--good); } .score.mixed { background: var(--mixed); color: #1d1500; }
    .score.bad { background: var(--bad); }
    /* User score — кольцо, как на Metacritic. */
    .score.user { border-radius: 50%; min-width: 32px; width: 32px; height: 32px; font-size: 12px; padding: 0;
      background: var(--card-2); border: 2.5px solid var(--none); color: var(--fg); }
    .score.user.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--card)); }
    .score.user.mixed { border-color: var(--mixed); background: color-mix(in srgb, var(--mixed) 18%, var(--card)); color: var(--fg); }
    .score.user.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--card)); }

    .tag { display: inline-block; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
      font-size: 12px; line-height: 21px; color: var(--muted); white-space: nowrap; background: var(--card-2); }
    .tag.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }

    .cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 8px; background: var(--card-2); flex: none; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cover .cover-bg { object-fit: cover; filter: blur(14px) saturate(1.2); transform: scale(1.2); opacity: .55; }
    .cover .cover-img { object-fit: contain; }
    .cover-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; letter-spacing: 1px; color: var(--muted);
      background: linear-gradient(135deg, var(--card-2), var(--bg-2)); }

    button, .btn { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover, button:hover:not(:disabled) { text-decoration: none; border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); min-width: 0; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    .table-scroll { overflow-x: auto; }
    /* В Telegram своя шапка с названием бота — нашу делаем компактнее и не липкой. */
    .tg header { position: static; }
    .tg header .brand .name { display: none; }
    @media (max-width: 560px) {
      header .wrap { gap: 12px; }
      header .brand .name { display: none; }
      header nav a { padding: 6px 12px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {# Иконки: простой SVG-спрайт, используется через <svg class="icon"><use href="#i-..."/></svg>. #}
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.73 5.1A3 3 0 0 0 7.2 16.1L9 14h6l1.8 2.1a3 3 0 0 0 5.2-2.58l-.74-5.1A4 4 0 0 0 17.3 5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-studio" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.2 3.2 0 0 1 0 6.2M21 20a6 6 0 0 0-3.5-5.4"/></symbol>
    <symbol id="i-platform" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  </svg>
  <header>
    <div class="wrap">
      <a class="brand" href="/"><span class="logo"><svg class="icon"><use href="#i-gamepad"/></svg></span><span class="name">Metacritic Games</span></a>
      <nav>
        <a href="/" class="{{ 'active' if nav == 'games' }}">Игры</a>
        <a href="/monitor" class="{{ 'active' if nav == 'monitor' }}">Мониторинг</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
  {# Telegram Mini App: вне Telegram скрипт ничего не делает (initData пустой). #}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  (() => {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (!tg || !tg.initData) return;
    const root = document.documentElement;
    root.classList.add('tg');
    tg.ready();
    tg.expand();
    // Цвета из темы Telegram — сайт выглядит частью клиента и в светлой, и в тёмной теме.
    const p = tg.themeParams || {};
    const vars = {
      '--bg': p.bg_color, '--bg-2': p.secondary_bg_color, '--card': p.section_bg_color || p.secondary_bg_color,
      '--card-2': p.secondary_bg_color, '--fg': p.text_color, '--muted': p.hint_color,
      '--accent': p.button_color, '--accent-2': p.link_color, '--line': p.section_separator_color,
    };
    for (const [name, value] of Object.entries(vars)) if (value) root.style.setProperty(name, value);
    root.style.colorScheme = tg.colorScheme === 'light' ? 'light' : 'dark';
    // Тень и «нет оценки» в тёмной палитре на белом фоне Telegram выглядят грязно.
    if (tg.colorScheme === 'light') {
      root.style.setProperty('--shadow', '0 6px 20px rgba(20, 32, 51, .08)');
      root.style.setProperty('--none', '#a9b3c4');
    }
    if (p.bg_color) {
      if (tg.setHeaderColor) tg.setHeaderColor(p.bg_color);
      if (tg.setBackgroundColor) tg.setBackgroundColor(p.bg_color);
    }
    // Системная «Назад» Telegram на внутренних страницах.
    if (location.pathname !== '/') {
      tg.BackButton.show();
      tg.BackButton.onClick(() => (history.length > 1 ? history.back() : location.assign('/')));
    }
    // Внешние ссылки (YouTube, Metacritic, Steam) — во внешнем браузере, а не внутри Mini App.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[target="_blank"]');
      if (!a) return;
      e.preventDefault();
      tg.openLink(a.href);
    });
  })();
  </script>
</body>
</html>
