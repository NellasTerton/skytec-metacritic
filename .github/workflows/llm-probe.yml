name: llm-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub Models via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for model in openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1; do
            echo "== $model"
            curl -s -D headers.txt -o body.json \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              https://models.github.ai/inference/chat/completions \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Ответь JSON {\\\"ok\\\": true, \\\"lang\\\": \\\"ru\\\"}\"}],\"response_format\":{\"type\":\"json_object\"},\"max_tokens\":30}"
            grep -iE "^HTTP|x-ratelimit" headers.txt
            head -c 400 body.json; echo
          done
          echo "== catalog"
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://models.github.ai/catalog/models \
            | python3 -c "import json,sys; [print(m['id'], m.get('rate_limit_tier')) for m in json.load(sys.stdin)]" | head -60
