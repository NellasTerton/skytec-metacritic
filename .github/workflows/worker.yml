name: worker

on:
  # Раз в час; минута не нулевая — в начале часа очередь Actions самая длинная.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Источник запуска (manual / web)"
        default: manual

# Не запускаем два прогона одновременно; новый ждёт окончания текущего.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # LLM для резюме: без ключей шаг резюме пропускается.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-worker.txt
      - run: alembic upgrade head
      - run: python -m app.worker run --trigger "${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger }}"
      # Дозаполнение: резюме для игр, которые не успели получить его раньше (лимиты LLM, ключа не было).
      - run: python -m app.worker summarize --limit 10
