name: probe-metacritic

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1 yt-dlp
      - name: Metacritic probe
        run: python probe/probe.py "$GITHUB_STEP_SUMMARY"
      - name: YouTube via yt-dlp
        continue-on-error: true
        run: |
          yt-dlp --simulate --print "%(title)s | %(view_count)s views" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | tee yt.txt
          { echo; echo "### yt-dlp"; echo '```'; cat yt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
